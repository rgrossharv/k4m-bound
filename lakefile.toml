name = "k4m_bound"
defaultTargets = ["KTheoryBound", "SelmerComparison"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The Lean development accompanying the claimed RH proof (package name `tree`),
# pinned to the exact commit whose community build cache we use.
[[require]]
name = "tree"
git = "https://github.com/leanprover-community/riemann-hypothesis.git"
rev = "23aebbb302010b292314d406aa97f7901d698634"

[[lean_lib]]
name = "KTheoryBound"
globs = ["KTheoryBound", "KTheoryBound.+"]

# The archive's `ShaU` equals the textbook Selmer group (light imports only).
[[lean_lib]]
name = "SelmerComparison"
globs = ["SelmerComparison.+"]
